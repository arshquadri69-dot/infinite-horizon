name: Build Infinite Horizon

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android toolchain
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platforms;android-28" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

          test -f "$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

          echo "Android toolchain ready."

      - name: Create Infinite Horizon project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project/src project/config

          cat > project/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(infinite_horizon_android LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          set(MOD_ID "infinite_horizon" CACHE STRING "LeviLauncher mod id")
          set(MOD_NAME "Infinite Horizon" CACHE STRING "LeviLauncher mod name")
          set(MOD_AUTHOR "AQ Explains" CACHE STRING "Mod author")
          set(MOD_VERSION "0.1.0" CACHE STRING "Mod version")
          set(MOD_LIBRARY_NAME "infinite_horizon" CACHE STRING "Native library name")
          set(MOD_MINECRAFT_VERSIONS "[\"1.26.*\"]" CACHE STRING "Supported Minecraft versions")

          include(FetchContent)

          FetchContent_Declare(
            preloader_android
            GIT_REPOSITORY https://github.com/LiteLDev/preloader-android.git
            GIT_TAG 0.2.2
            SOURCE_SUBDIR cmake/preloader-sdk
          )

          FetchContent_MakeAvailable(preloader_android)

          FetchContent_GetProperties(preloader_android)
          set(
            LEVI_PRELOADER_INCLUDE_DIR
            "${preloader_android_SOURCE_DIR}/include"
          )

          if(NOT TARGET preloader)
            add_subdirectory(
              "${preloader_android_SOURCE_DIR}"
              "${CMAKE_BINARY_DIR}/_preloader_android"
            )
          endif()

          add_library(${MOD_LIBRARY_NAME} SHARED
            src/main.cpp
          )

          set_target_properties(${MOD_LIBRARY_NAME} PROPERTIES
            OUTPUT_NAME "${MOD_LIBRARY_NAME}"
          )

          target_include_directories(${MOD_LIBRARY_NAME} PRIVATE
            "${LEVI_PRELOADER_INCLUDE_DIR}"
          )

          target_compile_options(${MOD_LIBRARY_NAME} PRIVATE
            -fvisibility=hidden
            -fvisibility-inlines-hidden
          )

          target_link_options(${MOD_LIBRARY_NAME} PRIVATE
            "-Wl,-z,max-page-size=16384"
          )

          target_link_libraries(${MOD_LIBRARY_NAME} PRIVATE
          preloader
          log
          )

          if(CMAKE_STRIP)
            add_custom_command(TARGET ${MOD_LIBRARY_NAME} POST_BUILD
              COMMAND "${CMAKE_STRIP}"
              --strip-unneeded
              "$<TARGET_FILE:${MOD_LIBRARY_NAME}>"
              VERBATIM
            )
          endif()

          configure_file(
            "${CMAKE_CURRENT_SOURCE_DIR}/manifest.json.in"
            "${CMAKE_CURRENT_BINARY_DIR}/manifest.json"
            @ONLY
          )

          set(LEVI_PACKAGE_ROOT
            "${CMAKE_CURRENT_BINARY_DIR}/package"
          )

          set(LEVI_PACKAGE_MOD_DIR
            "${LEVI_PACKAGE_ROOT}/${MOD_ID}"
          )

          set(LEVI_PACKAGE_FILE
            "${CMAKE_CURRENT_BINARY_DIR}/${MOD_ID}-${MOD_VERSION}-${CMAKE_ANDROID_ARCH_ABI}.levipack"
          )

          add_custom_target(levi_package
            COMMAND "${CMAKE_COMMAND}" -E rm -rf
              "${LEVI_PACKAGE_ROOT}"

            COMMAND "${CMAKE_COMMAND}" -E make_directory
              "${LEVI_PACKAGE_MOD_DIR}"

            COMMAND "${CMAKE_COMMAND}" -E copy
              "$<TARGET_FILE:${MOD_LIBRARY_NAME}>"
              "${LEVI_PACKAGE_MOD_DIR}/lib${MOD_LIBRARY_NAME}.so"

            COMMAND "${CMAKE_COMMAND}" -E copy
              "${CMAKE_CURRENT_BINARY_DIR}/manifest.json"
              "${LEVI_PACKAGE_MOD_DIR}/manifest.json"

            COMMAND "${CMAKE_COMMAND}" -E chdir
              "${LEVI_PACKAGE_ROOT}"
              "${CMAKE_COMMAND}" -E tar
              "cf"
              "${LEVI_PACKAGE_FILE}"
              --format=zip
              "${MOD_ID}"

            WORKING_DIRECTORY "${CMAKE_CURRENT_BINARY_DIR}"

            DEPENDS ${MOD_LIBRARY_NAME}

            COMMENT "Packaging ${MOD_ID}"

            VERBATIM
          )
          EOF

          cat > project/src/main.cpp <<'EOF'
          #include <pl/Mod.hpp>

          #include <filesystem>

          class InfiniteHorizonMod {
          public:
              static InfiniteHorizonMod& instance() {
                  static InfiniteHorizonMod mod;
                  return mod;
              }

              InfiniteHorizonMod()
                  : mSelf(*ll::mod::NativeMod::current()) {}

              [[nodiscard]]
              ll::mod::NativeMod& getSelf() const {
                  return mSelf;
              }

              bool load() {
                  auto& self = getSelf();

                  std::error_code ec;
                  std::filesystem::create_directories(
                      self.getDataDir(),
                      ec
                  );

                  self.getLogger().info(
                      "Infinite Horizon 0.1.0 loaded"
                  );

                  return true;
              }

              bool enable() {
                  getSelf().getLogger().info(
                      "Infinite Horizon enabled"
                  );

                  return true;
              }

              bool disable() {
                  getSelf().getLogger().info(
                      "Infinite Horizon disabled"
                  );

                  return true;
              }

              bool unload() {
                  getSelf().getLogger().info(
                      "Infinite Horizon unloaded"
                  );

                  return true;
              }

          private:
              ll::mod::NativeMod& mSelf;
          };

          PL_REGISTER_MOD(
              InfiniteHorizonMod,
              InfiniteHorizonMod::instance()
          )
          EOF

          cat > project/manifest.json.in <<'EOF'
          {
            "type": "preload-native",
            "name": "@MOD_NAME@",
            "author": "@MOD_AUTHOR@",
            "version": "@MOD_VERSION@",
            "entry": "lib@MOD_LIBRARY_NAME@.so",
            "icon": "",
            "minecraft_versions": @MOD_MINECRAFT_VERSIONS@
          }
          EOF

          echo "Project created."
          find project -maxdepth 2 -type f -print

      - name: Configure
        shell: bash
        run: |
          set -e

          cmake -S project \
            -B project/build-arm64-v8a \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DMOD_ID=infinite_horizon \
            -DMOD_NAME="Infinite Horizon" \
            -DMOD_AUTHOR="AQ Explains" \
            -DMOD_VERSION=0.1.0 \
            -DMOD_LIBRARY_NAME=infinite_horizon \
            '-DMOD_MINECRAFT_VERSIONS=["1.26.*"]'

      - name: Build package
        shell: bash
        run: |
          set -e

          cmake --build project/build-arm64-v8a \
            --target levi_package \
            --parallel 2

      - name: Verify package
        shell: bash
        run: |
          set -e

          PACK=$(find project/build-arm64-v8a \
            -maxdepth 1 \
            -type f \
            -name "*.levipack" \
            | head -n 1)

          test -n "$PACK"

          echo "SUCCESS:"
          echo "$PACK"

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: infinite-horizon-0.1.0-arm64
          path: project/build-arm64-v8a/*.levipack
          if-no-files-found: error
